    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-color:var(--sky-horizon);
  }
  .scene svg{position:absolute; inset:0; width:100%; height:100%;}
  .cloud{position:absolute; opacity:.85; animation: drift 60s linear infinite;}
  .cloud.c2{animation-duration:85s; animation-delay:-20s; opacity:.65;}
  .cloud.c3{animation-duration:100s; animation-delay:-50s; opacity:.5;}
  @keyframes drift{ from{transform:translateX(-12vw);} to{transform:translateX(112vw);} }
  @media (prefers-reduced-motion: reduce){
    .cloud{animation:none; left:20%;}
    .cloud.c2{left:55%;} .cloud.c3{left:80%;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- layout ---------- */
  .wrap{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(clamp(160px, 22vh, 220px) + 16px) 18px 44px;}
  .brandbar{display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
  .brandbar .brand-logo{height:18px; width:auto; display:block; filter:drop-shadow(0 1px 5px rgba(0,0,0,.22));}

  .card{
    position:relative;
    width:100%; max-width:460px;
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:34px 28px 30px;
    animation: rise .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brand-dark-blue); background:var(--paper-soft);
    border:1px solid var(--line); padding:5px 12px; border-radius:999px;
    margin-bottom:16px;
  }

  .stub{
    position:relative; margin:22px -28px; padding:0;
    border-top:2px dashed var(--line);
  }
  .stub::before,.stub::after{
    content:""; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%;
    background:var(--sky-horizon);
  }
  .stub::before{left:-11px;} .stub::after{right:-11px;}

  /* ---------- intro ---------- */
  .title{font-size:26px; font-weight:900; line-height:1.35; text-wrap:balance; margin-bottom:14px;}
  .lede{font-size:15px; line-height:1.75; color:var(--ink-soft); white-space:pre-line; margin-bottom:22px;}
  .btn{
    appearance:none; border:none; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:16px 20px; border-radius:16px;
    font-size:16px; font-weight:700; letter-spacing:-.01em;
    background:var(--brand-dark-blue); color:#fff;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 12px 26px -12px rgba(0,97,160,.65);
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.gold{background:var(--brand-yellow-bg); color:#0F3A26; box-shadow:0 12px 26px -12px rgba(85,184,118,.55);}
  .btn.ghost{background:transparent; color:#1C7A4B; box-shadow:none; border:1.5px solid rgba(85,184,118,.4);}
  .btn.small{padding:12px 16px; font-size:13px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed; transform:none;}
  .btnrow{display:flex; gap:10px; margin-top:6px;}
  .btnrow .btn{flex:1;}

  /* ---------- form ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:7px;}
  .field input{
    width:100%; padding:14px 16px; font-size:16px; font-family:inherit;
    border-radius:12px; border:1.5px solid var(--line); background:var(--paper-soft);
    color:var(--ink); font-variant-numeric:tabular-nums;
  }
  .field input:focus{outline:2px solid var(--brand-blue); outline-offset:1px; border-color:var(--brand-blue);}
  .field .hint{font-size:12px; color:var(--ink-faint); margin-top:6px;}
  .field .err{font-size:12px; color:var(--brand-berry); margin-top:6px; display:none; font-weight:700;}
  .field.invalid input{border-color:var(--brand-berry);}
  .field.invalid .err{display:block;}

  /* ---------- progress / flight path ---------- */
  .progresswrap{margin-bottom:22px;}
  .progresstop{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .progresstop .qn{font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase;}
  .progresstop .qn b{color:var(--brand-dark-blue); font-size:14px;}
  .flightpath{position:relative; height:20px;}
  .flightpath .track{position:absolute; top:9px; left:2px; right:2px; height:2px; border-top:2px dashed var(--line);}
  .flightpath .fill{position:absolute; top:9px; left:2px; height:2px; background:var(--brand-blue); transition:width .35s ease;}
  .flightpath .plane{position:absolute; top:-2px; transform:translateX(-50%); font-size:18px; transition:left .35s ease; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));}

  /* ---------- question ---------- */
  .qtext{font-size:19px; font-weight:700; line-height:1.5; margin-bottom:20px; text-wrap:balance;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .option{
    width:100%; text-align:left; padding:15px 16px; border-radius:14px;
    border:1.5px solid var(--line); background:var(--paper-soft); color:var(--ink);
    font-size:14.5px; line-height:1.55; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .option:hover{border-color:var(--brand-blue);}
  .option:active{transform:scale(.99);}
  .option.selected{border-color:var(--brand-dark-blue); background:linear-gradient(0deg, var(--paper-soft), var(--paper-soft)); box-shadow:inset 0 0 0 2px var(--brand-dark-blue);}

  /* ---------- result ---------- */
  .resulthead{text-align:center; margin-bottom:6px;}
  .resulthead .stamp{
    width:96px; height:96px; margin:0 auto 14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:48px;
    background: var(--type-tint, var(--paper-soft));
    border:3px solid var(--type-color, var(--brand-dark-blue));
    box-shadow:0 10px 24px -10px var(--type-color, var(--brand-dark-blue));
  }
  .resulthead .code{
    display:inline-block; font-size:12px; font-weight:800; letter-spacing:.18em;
    color:var(--type-color, var(--brand-dark-blue)); margin-bottom:6px;
  }
  .resulthead h2{font-size:24px; font-weight:900; margin-bottom:8px;}
  .resulthead .tagline{font-size:14.5px; color:var(--ink-soft); line-height:1.6;}

  .section{margin-top:22px;}
  .section h3{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px;}
  .trait-block{border-radius:16px; padding:16px 16px 14px; margin-top:16px;}
  .trait-block h3{display:flex; align-items:center; gap:6px; color:var(--type-color, var(--ink-faint)); margin-bottom:12px;}
  .trait-block h3 .ico{font-size:14px;}
  .trait-self{background:transparent; border:1.5px solid color-mix(in srgb, var(--type-color, var(--brand-dark-blue)) 45%, transparent);}
  .trait-friends{background:transparent; border:1.5px dashed color-mix(in srgb, var(--type-color, var(--brand-dark-blue)) 45%, transparent);}
  .tags{display:flex; flex-wrap:wrap; gap:7px;}
  .tag{font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:999px; background:color-mix(in srgb, var(--brand-yellow-bg) 22%, var(--paper-soft)); color:#0F3A26; border:1px solid color-mix(in srgb, var(--brand-yellow-bg) 45%, transparent);}
  .list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .list li{font-size:14px; line-height:1.6; padding-left:20px; position:relative; color:var(--ink);}
  .list li::before{content:"✦"; position:absolute; left:0; top:1px; color:var(--type-color, var(--brand-dark-blue)); font-size:12px;}
  .trips{display:flex; flex-wrap:wrap; gap:8px;}
  .trip{font-size:13px; padding:8px 12px; background:var(--paper-soft); border-radius:12px; border:1px solid var(--line);}

  .barrow{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .barrow .blabel{width:70px; font-size:12px; font-weight:700; color:var(--ink-soft); flex-shrink:0;}
  .barrow .btrack{flex:1; height:8px; background:var(--gray-100); border-radius:999px; overflow:hidden;}
  .barrow .bfill{height:100%; border-radius:999px; background:var(--brand-blue);}
  .barrow .bval{width:34px; text-align:right; font-size:12px; font-weight:700; color:var(--ink-faint); font-variant-numeric:tabular-nums;}

  .submitnote{font-size:12.5px; color:var(--ink-faint); text-align:center; margin-top:10px; line-height:1.6;}

  .footnote{margin-top:18px; font-size:11.5px; color:var(--ink-faint); text-align:center; line-height:1.6;}

  @media (max-width:420px){
    .card{padding:28px 20px 24px; border-radius:20px;}
    .title{font-size:23px;}
    .stub{margin:20px -20px;}
  }
</style>
</head>
<body>

      var opt=q.options[answers[i]];
      scores.D+=opt.p.D; scores.A+=opt.p.A; scores.I+=opt.p.I;
    });
    var keySum={D:0,A:0,I:0};
    KEY_Q_INDEX.forEach(function(i){
      // Only the option's DOMINANT trait counts toward the Key tie-break sum;
      // minor secondary-trait leakage on a key question (e.g. Q5's mixed-point
      // options) is excluded. Matches the source spreadsheet's corrected model.
      var p=QUESTIONS[i].options[answers[i]].p;
      var dom='D';
      if(p.A>p[dom]) dom='A';
      if(p.I>p[dom]) dom='I';
      keySum[dom]+=p[dom];
    });
    var order=["D","A","I"];
    var sorted=order.slice().sort(function(a,b){return scores[b]-scores[a];});
    var top=sorted[0], third=sorted[2];
    var gap12=scores[top]-scores[sorted[1]];
    var gap13=scores[top]-scores[third];
    var type;
    if(gap12/TOTAL_POINTS >= 0.20){
      type=top;
    } else if(gap13/TOTAL_POINTS <= 0.05){
      type="C";
    } else if(scores.A > scores.D){
      type="AI";
    } else if(scores.A > scores.I){
      type="DA";
    } else if(scores.A < scores.I){
      type="DI";
    } else {
      type = keySum.A > keySum.I ? "DA" : "DI";
    }
    return {scores:scores, type:type};
  }

      '<div style="height:18px;"></div>' +
      '<div class="field" id="nameField"><label for="nameInput">이름</label><input id="nameInput" type="text" placeholder="홍길동" autocomplete="off" value="'+esc(state.name)+'"><div class="err">이름을 입력해주세요.</div></div>' +
      '<div class="field" id="idField"><label for="idInput">사번 (8자리 숫자)</label><input id="idInput" type="text" inputmode="numeric" maxlength="8" placeholder="00000000" autocomplete="off" value="'+esc(state.empId)+'"><div class="hint">숫자 8자리만 입력해주세요.</div><div class="err">사번은 숫자 8자리로 입력해주세요.</div></div>' +
      '<div class="btnrow"><button class="btn ghost" id="backBtn" type="button">이전</button><button class="btn gold" id="nextBtn" type="button">다음 →</button></div>';
    document.getElementById("backBtn").addEventListener("click", function(){ state.screen="intro"; render(); });
    document.getElementById("nextBtn").addEventListener("click", function(){
      var name = document.getElementById("nameInput").value.trim();
      var empId = document.getElementById("idInput").value.trim();
      var okName = name.length>0;
      var okId = /^\d{8}$/.test(empId);
      document.getElementById("nameField").classList.toggle("invalid", !okName);
      document.getElementById("idField").classList.toggle("invalid", !okId);
      if(!okName || !okId) return;
      state.name=name; state.empId=empId; state.qi=0; state.screen="quiz"; render();
    });
    document.getElementById("idInput").addEventListener("input", function(e){
      e.target.value = e.target.value.replace(/\D/g,"").slice(0,8);
    });
  }

  /* ============ render: quiz ============ */
  function renderQuiz(){
    var qi = state.qi;
    var q = QUESTIONS[qi];
    var pct = (qi/QUESTIONS.length)*100;
    var optsHtml = q.options.map(function(o,idx){
      var sel = state.answers[qi]===idx ? " selected" : "";
      return '<button class="option'+sel+'" type="button" data-idx="'+idx+'">'+esc(o.t)+'</button>';
    }).join("");
    app.innerHTML =
      '<div class="progresswrap">' +
        '<div class="progresstop"><span class="qn">TRAVEL ITINERARY</span><span class="qn"><b>'+(qi+1)+'</b> / '+QUESTIONS.length+'</span></div>' +
        '<div class="flightpath"><div class="track"></div><div class="fill" style="width:'+pct+'%;"></div><div class="plane" style="left:'+pct+'%;">✈︎</div></div>' +
      '</div>' +
      '<p class="qtext">'+esc(q.q)+'</p>' +
      '<div class="options">'+optsHtml+'</div>' +
      (qi>0 ? '<div class="btnrow" style="margin-top:18px;"><button class="btn ghost" id="prevBtn" type="button">← 이전 질문</button></div>' : '');
    var optionEls = app.querySelectorAll(".option");
    optionEls.forEach(function(el){
      el.addEventListener("click", function(){
        var idx = parseInt(el.getAttribute("data-idx"),10);
        state.answers[qi]=idx;
        optionEls.forEach(function(o){o.classList.remove("selected");});
        el.classList.add("selected");
        window.setTimeout(function(){
          if(qi < QUESTIONS.length-1){ state.qi=qi+1; render(); }
          else { finishQuiz(); render(); }
        }, 380);
      });
    });
    var prevBtn = document.getElementById("prevBtn");
    if(prevBtn) prevBtn.addEventListener("click", function(){ state.qi=qi-1; render(); });
  }

  function finishQuiz(){
    var result = computeResult(state.answers);
    var record = {
      name: state.name, empId: state.empId,
      answers: state.answers.slice(),
      scores: result.scores, type: result.type
    };
    state.record = record;
    state.screen = "result";
    submitWithRetries(record);
  }

  /* ============ Google Form submission ============ */
  function buildEntryParams(record){
    var answersStr = record.answers.map(function(a){ return (a===null||a===undefined) ? "" : String(a+1); }).join(",");
    var t = TYPES[record.type];
    var params = {};
    params[ENTRY.name]    = record.name;
    params[ENTRY.empId]   = record.empId;
    params[ENTRY.answers] = answersStr;
    params[ENTRY.scoreD]  = String(record.scores.D);
    params[ENTRY.scoreA]  = String(record.scores.A);
    params[ENTRY.scoreI]  = String(record.scores.I);
    params[ENTRY.type]    = record.type + " (" + t.name + ")";
    return params;
  }

  function submitViaHiddenForm(params){
    var form = document.createElement("form");
    form.method = "POST";
    form.action = FORM_ACTION;
    form.target = "hiddenSubmitFrame";
    form.style.display = "none";
    Object.keys(params).forEach(function(key){
      var input = document.createElement("input");
      input.type = "hidden";
      input.name = "entry." + key;
      input.value = params[key];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    window.setTimeout(function(){ if(form.parentNode) form.parentNode.removeChild(form); }, 4000);
  }

  // We cannot read the cross-origin response from the hidden iframe, so we
  // never get a real success/failure signal back from Google. As a
  // best-effort safety net against a transient hiccup on the very first
  // attempt, silently re-send the same submission twice more a few seconds
  // apart. Harmless if the first attempt already worked -- duplicate rows
  // are far less costly than a silently lost response.
  function submitWithRetries(record){
    var params = buildEntryParams(record);
    try{ submitViaHiddenForm(params); }catch(e){}
    window.setTimeout(function(){ try{ submitViaHiddenForm(params); }catch(e){} }, 2500);
    window.setTimeout(function(){ try{ submitViaHiddenForm(params); }catch(e){} }, 6000);
  }

  /* ============ render: result ============ */
  function renderResult(record){
    var t = TYPES[record.type];
    var s = record.scores;
    function bar(label,val){
      return '<div class="barrow"><span class="blabel">'+label+'</span><div class="btrack"><div class="bfill" style="width:'+Math.round((val/TOTAL_POINTS)*100)+'%; background:'+t.color+';"></div></div><span class="bval">'+val+'</span></div>';
    }
    app.innerHTML =
      '<div style="--type-color:'+t.color+'; --type-tint: color-mix(in srgb, '+t.color+' 16%, var(--paper-soft));">' +
      '<div class="resulthead">' +
        '<div class="stamp">'+t.emoji+'</div>' +
        '<span class="code">TYPE · '+t.code+'</span>' +
        '<h2>'+esc(t.name)+'</h2>' +
        '<p class="tagline">'+esc(t.tagline)+'</p>' +
      '</div>' +
      '<div class="stub"></div>' +
      '<div class="section">' + bar("주도형(D)",s.D) + bar("분석형(A)",s.A) + bar("관계형(I)",s.I) + '</div>' +
      '<div class="section"><h3>나의 여행 키워드</h3><div class="tags">'+t.keywords.map(function(k){return '<span class="tag">'+esc(k)+'</span>';}).join("")+'</div></div>' +
      '<div class="section trait-block trait-self"><h3><span class="ico">&#9992;&#65039;</span>여행할 때 나는?</h3><ul class="list">'+t.traits.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>' +
      '<div class="section trait-block trait-friends"><h3><span class="ico">&#128064;</span>친구들이 보는 나</h3><ul class="list">'+t.friends.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>' +
      '<div class="section"><h3>추천 여행</h3><div class="trips">'+t.trips.map(function(x){return '<span class="trip">'+esc(x)+'</span>';}).join("")+'</div></div>' +
      '<div class="btnrow" style="margin-top:24px;"><button class="btn ghost" id="restartBtn" type="button">다시 테스트하기</button></div>' +
      '<p class="submitnote">응답이 전송되었습니다.</p>' +
      '</div>';
    document.getElementById("restartBtn").addEventListener("click", function(){
      state = { screen:"intro", name:"", empId:"", qi:0, answers:new Array(QUESTIONS.length).fill(null), record:null };
      render();
    });
  }

  /* ============ router ============ */
  function render(){
    if(state.screen==="intro") renderIntro();
    else if(state.screen==="form") renderForm();
    else if(state.screen==="quiz") renderQuiz();
    else if(state.screen==="result") renderResult(state.record);
  }

  render();
})();
</script>
</body>
</html>
